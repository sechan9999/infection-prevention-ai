name: conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-conformance:
    name: Structural conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run conformance checks
        run: bash scripts/conformance.sh

      - name: Summary
        if: always()
        run: |
          {
            echo "### Structural conformance"
            echo ""
            echo '```'
            NO_COLOR=1 bash scripts/conformance.sh || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
